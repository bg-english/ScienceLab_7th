<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F3D2E">
<title>SciLab — Boston Flex — 7th Grade Science</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EA;--paper:#FFFDF7;--ink:#0F3D2E;
  --green:#1F8A4C;--green-dk:#126B39;--green-lt:#E2F3E8;
  --leaf:#5BB85C;--leaf-lt:#EAF6EA;
  --red:#C8202E;--red-dk:#9E1623;
  --gold:#E9A72C;--gold-dk:#BE8418;
  --soft:#FCE6C4;--line:#E7DCC6;
  --blue:#1E50A0;--blue-lt:#E4ECF8;
  --ok:#1FAA66;--bad:#E64545;
  --sky:#7EC8E3;--sky-lt:#E6F5FB;
  --shadow:0 14px 38px rgba(15,61,46,.16);--shadow-sm:0 4px 14px rgba(15,61,46,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Lexend',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;overflow-x:hidden;
  background-image:radial-gradient(circle at 8% 10%,rgba(233,167,44,.12),transparent 38%),radial-gradient(circle at 92% 4%,rgba(31,138,76,.12),transparent 40%),radial-gradient(circle at 50% 100%,rgba(126,200,227,.10),transparent 40%);}
h1,h2,h3,h4,.display{font-family:'Bricolage Grotesque',sans-serif;line-height:1.06}
button{font-family:'Lexend';cursor:pointer}
.hidden{display:none!important}

/* ===== TOPBAR ===== */
.top{position:sticky;top:0;z-index:60;background:rgba(255,253,247,.94);backdrop-filter:blur(10px);border-bottom:3px solid var(--gold)}
.top .row{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 18px}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--leaf));display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);flex-shrink:0}
.brand .bt{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.1rem;line-height:1}
.brand .bt small{display:block;font-family:'Lexend';font-weight:600;font-size:.56rem;letter-spacing:.18em;color:var(--red);text-transform:uppercase}
.tabs{display:flex;gap:3px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{font-size:.8rem;font-weight:600;color:var(--ink);background:none;border:none;padding:8px 13px;border-radius:30px;opacity:.7;transition:.2s}
.tab:hover{background:var(--green-lt);opacity:1}
.tab.active{background:var(--ink);color:#fff;opacity:1}
.tab-dropdown{position:relative;display:inline-block}
.tab-dd-btn{font-size:.8rem;font-weight:600;color:var(--ink);background:none;border:none;padding:8px 13px;border-radius:30px;opacity:.7;transition:.2s;font-family:'Lexend'}
.tab-dd-btn:hover{background:var(--green-lt);opacity:1}
.tab-dd-btn[aria-expanded="true"]{opacity:1}
.tab-dd-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:6px;min-width:180px;z-index:70}
.tab-dd-menu.show{display:block;animation:pop .2s}
.tab-dd-item{display:block;width:100%;text-align:left;font-family:'Lexend';font-size:.85rem;font-weight:600;color:var(--ink);background:none;border:none;padding:10px 14px;border-radius:12px;transition:.15s}
.tab-dd-item:hover{background:var(--green-lt)}
.tab-dd-item.active{background:var(--ink);color:#fff}
.stats{display:flex;align-items:center;gap:10px}
.stat{display:flex;align-items:center;gap:5px;font-weight:700;font-size:.82rem;background:var(--paper);border:2px solid var(--line);padding:5px 11px;border-radius:30px;white-space:nowrap}
.stat .lv{color:var(--green)}.stat .xp{color:var(--gold-dk)}.stat .st{color:var(--red)}
@media(max-width:920px){.tabs{order:3;width:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:4px}.tab{flex-shrink:0}}
@media(max-width:520px){.stat{font-size:.72rem;padding:4px 8px}.brand .bt small{display:none}.sync-indicator{display:none}}

.view{max-width:1100px;margin:0 auto;padding:40px 22px 90px;animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-block;font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red-dk);background:var(--soft);padding:6px 14px;border-radius:30px;margin-bottom:14px}
.h-title{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:800;margin-bottom:8px}
.h-sub{font-size:1.02rem;max-width:680px;opacity:.82;margin-bottom:32px}

.btn{font-weight:700;font-size:.98rem;border:none;padding:14px 26px;border-radius:40px;transition:transform .15s,box-shadow .2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(200,32,46,.32)}
.btn-primary:hover{transform:translateY(-3px)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(30,80,160,.3)}
.btn-blue:hover{transform:translateY(-3px)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(31,138,76,.3)}
.btn-green:hover{transform:translateY(-3px)}
.btn-ghost{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.btn-ghost:hover{background:var(--ink);color:#fff}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-sm{font-size:.8rem;padding:9px 16px}
.btn:disabled{opacity:.45;cursor:default;transform:none!important}

/* ===== DASHBOARD ===== */
.dash-hero{display:flex;align-items:center;gap:26px;background:linear-gradient(140deg,var(--ink),#17603c);color:#fff;border-radius:28px;padding:34px;position:relative;overflow:hidden}
.dash-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 120%,rgba(233,167,44,.28),transparent 50%)}
.dash-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(126,200,227,.35),transparent 70%)}
.dash-hero .txt{flex:1;position:relative;z-index:1}
.dash-hero h1{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:800;margin-bottom:8px}
.dash-hero h1 .hl{color:var(--gold)}
.dash-hero p{opacity:.88;max-width:52ch;margin-bottom:18px}
.dash-hero .mascot{width:min(28vw,190px);flex:0 0 auto;position:relative;z-index:1}
.dash-hero .mascot .plant{font-size:8rem;filter:drop-shadow(0 14px 22px rgba(0,0,0,.4));animation:bob 5s ease-in-out infinite;text-align:center;line-height:1}
.dash-hero .mascot .lbl{text-align:center;font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:6px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(max-width:720px){.dash-hero{flex-direction:column;text-align:center}.dash-hero .mascot{width:140px}}

.grid{display:grid;gap:18px}
.cards-3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.cards-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:22px;cursor:pointer;transition:transform .18s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-sm);border-color:var(--green)}
.card .ci{font-size:2rem;margin-bottom:10px;display:inline-block}
.card h3{font-size:1.05rem;margin-bottom:6px}
.card p{font-size:.85rem;opacity:.75}
.card .go{position:absolute;right:18px;bottom:16px;font-size:1.1rem;opacity:.35;transition:.2s}
.card:hover .go{opacity:1;transform:translateX(4px)}
.card .tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.tag-green{background:var(--green-lt);color:var(--green-dk)}
.tag-blue{background:var(--blue-lt);color:var(--blue)}
.tag-gold{background:var(--soft);color:var(--gold-dk)}
.tag-red{background:#fbe4e6;color:var(--red)}

/* ===== LESSON CARDS ===== */
.lesson-card{border-left:6px solid var(--green);background:var(--paper);border-radius:18px;padding:22px;margin-bottom:16px;border:2px solid var(--line);border-left-width:6px;cursor:pointer;transition:transform .18s,box-shadow .2s}
.lesson-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.lesson-card .lc-top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.lesson-card .lc-num{width:44px;height:44px;border-radius:14px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;flex-shrink:0;font-family:'Bricolage Grotesque'}
.lesson-card h3{font-size:1.15rem}
.lesson-card .lc-date{font-size:.75rem;color:var(--green-dk);font-weight:600;margin-top:2px}
.lesson-card .lc-bible{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:.82rem;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.lesson-card .lc-bible .ic{flex-shrink:0}
.lesson-card .lc-verse{font-style:italic;opacity:.85;display:block;margin-top:4px;font-size:.78rem}

/* ===== PRACTICE ===== */
.prac-setup{text-align:center;padding:20px 0}
.skill-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 24px}
.skill-pill{font-size:.82rem;font-weight:600;padding:9px 16px;border-radius:30px;background:var(--paper);border:2px solid var(--line);color:var(--ink);transition:.18s}
.skill-pill:hover{border-color:var(--green);background:var(--green-lt)}
.skill-pill.active{background:var(--green);border-color:var(--green);color:#fff}
.eq-card{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:28px;max-width:720px;margin:0 auto;box-shadow:var(--shadow-sm)}
.eq-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:.78rem;font-weight:600}
.eq-prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px}
.eq-prog .fill{height:100%;background:linear-gradient(90deg,var(--green),var(--leaf));border-radius:6px;transition:width .3s}
.eq-q{font-family:'Bricolage Grotesque';font-size:1.35rem;font-weight:700;line-height:1.35;margin-bottom:24px}
.eq-q .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--gold);text-align:center;color:var(--gold-dk);font-weight:800}
.eq-q .verb-hint{display:inline-block;background:var(--soft);border-radius:10px;padding:2px 10px;font-size:.85rem;font-family:'Lexend';font-weight:600;color:var(--gold-dk);margin-left:4px}
.eq-opts{display:grid;gap:12px}
.eq-opt{font-size:1rem;font-weight:600;text-align:left;padding:15px 18px;border-radius:16px;background:var(--paper);border:2px solid var(--line);color:var(--ink);transition:.15s}
.eq-opt:hover{border-color:var(--green);background:var(--green-lt)}
.eq-opt.correct{background:#d6f5e3;border-color:var(--ok);color:#0b7a3e}
.eq-opt.wrong{background:#fbe4e6;border-color:var(--bad);color:var(--red-dk)}
.eq-fill input{width:100%;font-family:'Lexend';font-size:1.1rem;font-weight:600;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink);outline:none}
.eq-fill input:focus{border-color:var(--green)}
.eq-fb{margin-top:18px;padding:14px 18px;border-radius:14px;font-size:.9rem;animation:fade .3s}
.eq-fb.ok{background:var(--green-lt);border:2px solid var(--ok)}
.eq-fb.no{background:#fbe4e6;border:2px solid var(--bad)}
.eq-fb .hint-tip{font-size:.82rem;color:var(--blue);font-weight:600;cursor:pointer;margin-top:6px;display:inline-block}
.eq-actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ===== FLASHCARDS ===== */
.deck-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.deck-card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:center;transition:.18s;cursor:pointer}
.deck-card:hover{border-color:var(--green)}
.deck-card .box{display:inline-block;width:34px;height:34px;border-radius:50%;font-weight:800;line-height:34px;margin-bottom:8px;font-family:'Bricolage Grotesque'}
.box1{background:var(--sky-lt);color:var(--blue)}.box2{background:var(--leaf-lt);color:var(--green)}
.box3{background:var(--soft);color:var(--gold-dk)}.box4{background:var(--blue-lt);color:var(--blue)}
.box5{background:var(--green);color:#fff}
.deck-card .dc-name{font-size:.8rem;font-weight:600}
.deck-card .dc-box{font-size:.7rem;color:#8a8a8a;margin-top:4px}
.flashcard-wrap{perspective:1200px;max-width:560px;margin:0 auto 20px}
.flashcard{position:relative;width:100%;height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;box-shadow:var(--shadow-sm)}
.fc-front{background:linear-gradient(135deg,var(--green),var(--leaf));color:#fff}
.fc-front .fc-q{font-family:'Bricolage Grotesque';font-size:1.5rem;font-weight:800;line-height:1.3}
.fc-front .fc-skill{position:absolute;top:16px;left:18px;font-size:.72rem;font-weight:600;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px}
.fc-front .fc-flip-hint{position:absolute;bottom:16px;font-size:.75rem;opacity:.7}
.fc-back{background:var(--paper);border:2px solid var(--green);transform:rotateY(180deg);justify-content:flex-start;overflow-y:auto}
.fc-back .fc-a{font-size:1.25rem;font-weight:700;color:var(--green-dk);margin-bottom:10px}
.fc-back .fc-extra{font-size:.9rem;opacity:.85}
.fc-rating{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.fc-btn{font-size:.85rem;font-weight:700;padding:10px 20px;border-radius:30px;border:none;transition:.15s}
.fc-btn:hover{transform:translateY(-2px)}
.fc-btn.good{background:var(--green);color:#fff}
.fc-btn.mid{background:var(--gold);color:var(--ink)}
.fc-btn.bad{background:var(--red);color:#fff}

/* ===== WRITE ===== */
.write-prompt{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:24px;margin-bottom:16px}
.write-prompt h3{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.write-prompt .wp-meta{font-size:.78rem;color:var(--green-dk);font-weight:600;margin-bottom:8px}
.write-prompt .wp-body{font-size:.95rem;opacity:.9}
.write-area textarea{width:100%;min-height:180px;font-family:'Lexend';font-size:1rem;padding:18px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink);outline:none;resize:vertical}
.write-area textarea:focus{border-color:var(--green)}

/* ===== EXAM ===== */
.exam-prog{max-width:720px;margin:0 auto 24px}
.exam-q{max-width:720px;margin:0 auto}
.exam-summary{max-width:720px;margin:0 auto;text-align:center}
.exam-summary .score-ring{width:150px;height:150px;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:2.4rem;border:10px solid var(--green);color:var(--green-dk)}

/* ===== REINFORCE ===== */
.rf-card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:22px;margin-bottom:14px}
.rf-card .rf-icon{font-size:2rem;margin-bottom:8px}
.rf-card h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rf-card .rf-weak{display:inline-block;font-size:.68rem;font-weight:700;background:var(--soft);color:var(--gold-dk);padding:3px 10px;border-radius:20px;margin-left:8px;text-transform:uppercase;letter-spacing:.06em}
.rf-theory{background:var(--green-lt);border-radius:14px;padding:16px 18px;font-size:.9rem;margin:12px 0;border-left:4px solid var(--green)}
.rf-theory .rf-vocab{background:var(--paper);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.85rem}
.rf-theory .rf-vocab b{color:var(--green-dk)}

/* ===== LEADERBOARD ===== */
.lb-card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;display:flex;align-items:center;gap:16px;transition:.15s}
.lb-card.top{background:linear-gradient(135deg,#FFF8E1,var(--soft));border-color:var(--gold)}
.lb-rank{width:42px;height:42px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;font-family:'Bricolage Grotesque';flex-shrink:0}
.lb-rank.r1{background:var(--gold);color:#fff}.lb-rank.r2{background:#C0C0C0;color:#fff}.lb-rank.r3{background:#CD7F32;color:#fff}
.lb-name{flex:1;font-weight:700}
.lb-name small{display:block;font-weight:400;font-size:.78rem;color:#8a8a8a}
.lb-xp{font-weight:800;color:var(--gold-dk);font-family:'Bricolage Grotesque';font-size:1.05rem}
.lb-me{outline:3px solid var(--green);outline-offset:2px}

/* ===== MODALS ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,61,46,.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s}
.modal-card{background:var(--paper);border-radius:28px;padding:34px;max-width:440px;width:100%;box-shadow:var(--shadow);text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h2{font-size:1.5rem;margin-bottom:8px}
.modal-card .mc-sub{font-size:.92rem;opacity:.8;margin-bottom:20px}
.modal-card select,.modal-card input[type=text]{width:100%;font-family:'Lexend';font-size:1rem;font-weight:600;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);outline:none;margin-bottom:12px}
.modal-card select:focus,.modal-card input[type=text]:focus{border-color:var(--green)}
.mc-err{color:var(--bad);font-size:.85rem;margin-bottom:10px;min-height:1.2em}
.mc-steps{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.mc-step{width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.mc-step.on{background:var(--green);color:#fff}
.sec-btns{display:grid;gap:10px;margin-bottom:12px}
.sec-btn{font-size:1rem;font-weight:700;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink);transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.sec-btn:hover{border-color:var(--green);background:var(--green-lt);transform:translateY(-2px)}
.lvlup-big{font-size:3.2rem;font-weight:800;font-family:'Bricolage Grotesque';color:var(--green);line-height:1}
.lvlup-title{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.7rem;margin:10px 0 6px}
.lvlup-msg{font-size:.95rem;opacity:.85;margin-bottom:18px}

/* ===== INTERVENTION ===== */
.interv-overlay{position:fixed;inset:0;background:rgba(15,61,46,.6);backdrop-filter:blur(5px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s}
.interv-card{background:var(--paper);border-radius:26px;padding:30px;max-width:560px;width:100%;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto;animation:pop .3s}
.interv-card .ic-head{font-size:2.4rem;text-align:center;margin-bottom:8px}
.interv-card h2{font-size:1.35rem;margin-bottom:8px}
.interv-card .ic-sub{font-size:.9rem;opacity:.8;margin-bottom:16px}
.interv-card textarea{width:100%;min-height:90px;font-family:'Lexend';font-size:.95rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);outline:none;resize:vertical;margin-bottom:14px}
.interv-card textarea:focus{border-color:var(--green)}
.interv-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.interv-explain{background:var(--green-lt);border-radius:14px;padding:18px;margin-top:16px;font-size:.95rem;border-left:4px solid var(--green);white-space:pre-line}
.interv-theory{margin-top:10px}
.interv-video{position:relative;padding-bottom:56.25%;height:0;border-radius:14px;overflow:hidden;margin:16px 0 8px}
.interv-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ===== LOADER ===== */
.fl-loader{text-align:center;padding:18px 10px}
.fl-ring{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.fl-dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.fl-dots span{width:8px;height:8px;border-radius:50%;background:var(--green);animation:dot 1.2s infinite}
.fl-dots span:nth-child(2){animation-delay:.15s}.fl-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
.fl-msg{font-size:.9rem;color:var(--green-dk);font-weight:600;transition:opacity .2s}
.fl-msg.fade{opacity:0}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:14px 24px;border-radius:40px;display:flex;align-items:center;gap:10px;z-index:400;transition:transform .35s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast img{width:30px;height:30px;border-radius:50%}
.toast.good{background:linear-gradient(135deg,var(--green),var(--green-dk))}
.toast.bad{background:linear-gradient(135deg,var(--bad),var(--red-dk))}

/* ===== CONFETTI ===== */
.confetti{position:fixed;top:-20px;width:12px;height:12px;z-index:500;pointer-events:none;border-radius:2px}

/* ===== SYNC ===== */
.sync-indicator{font-size:.7rem;font-weight:700;display:flex;align-items:center;gap:4px;color:#8a8a8a}
.sync-indicator .dot{width:8px;height:8px;border-radius:50%;background:#8a8a8a;display:inline-block}
.sync-indicator.ok .dot{background:var(--ok)}.sync-indicator.error .dot{background:var(--bad)}
.sync-indicator.syncing .dot{background:var(--gold);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* ===== NOTICE ===== */
.notice-bar{background:linear-gradient(135deg,var(--blue),var(--green-dk));color:#fff;padding:10px 24px;display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600;animation:fade .3s}

/* ===== MISCELLANEOUS ===== */
.mastery-bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden;flex:1;min-width:80px}
.mastery-bar .fill{height:100%;background:linear-gradient(90deg,var(--green),var(--leaf));border-radius:8px;transition:width .4s}
.mastery-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.mastery-row:last-child{border-bottom:none}
.mastery-label{width:170px;font-weight:600;flex-shrink:0}
.mastery-pct{width:44px;text-align:right;font-weight:700;flex-shrink:0;font-size:.8rem}
.next-skill-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--ink),var(--green-dk));color:#fff;border-radius:16px;padding:14px 18px;margin-top:16px;text-align:left}
.next-skill-banner .ns-icon{font-size:1.6rem}
.next-skill-banner .ns-txt{flex:1}
.next-skill-banner .ns-txt b{display:block}
.next-skill-banner .ns-txt small{opacity:.8;font-size:.78rem}

@media(max-width:600px){
  .mastery-label{width:120px}
  .cards-3{grid-template-columns:1fr}
  .eq-q{font-size:1.1rem}
}
</style>

<script>
/* ============================================================
   SciLab — 7th Grade Science Study App (Boston Flex)
   Second Term: Photosynthesis · Plant Respiration · Human Respiratory System
   Design layer mirrors FutureLab (Future_and_conditionals repo).
   ============================================================ */

/* ===== global error catcher (dev aid) ===== */
window.onerror=function(msg,src,line,col,err){
  var t=document.getElementById('toast');
  if(t){document.getElementById('toastMsg').textContent='JS Error: '+msg.slice(0,80)+' (L'+line+')';t.className='toast show bad';clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast';},5000);}
  console.error('SciLab Error:',msg,'Line:',line,err);
  return false;
};

/* ===== Supabase constants (edit these after creating your project) ===== */
const SB_URL='https://YOUR-PROJECT.supabase.co';
const SB_KEY='YOUR-ANON-KEY';
const SB_TABLE='sciencelab_scores';

/* ===== guarded storage ===== */
const Store=(()=>{let ok=false,mem={};try{const k="__sl";localStorage.setItem(k,"1");localStorage.removeItem(k);ok=true;}catch(e){ok=false;}
  return{get(k,d){try{if(ok){const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}}catch(e){}return k in mem?mem[k]:d;},
         set(k,v){try{if(ok){localStorage.setItem(k,JSON.stringify(v));return;}}catch(e){}mem[k]=v;}};})();

/* ===== SKILLS (12 topics from the Science temario) ===== */
const SKILLS={
  'photo-process':'Photosynthesis Process',
  'photo-inputs':'What Plants Eat',
  'photo-outputs':'Plant Food & Products',
  'chlorophyll':'Chlorophyll & Leaves',
  'stomata':'Stomata & Gas Exchange',
  'plant-resp':'Plant Respiration',
  'root-resp':'Root Respiration',
  'human-organs':'Respiratory Organs',
  'breathing':'Breathing Mechanism',
  'gas-exchange':'Gas Exchange in Lungs',
  'resp-care':'Respiratory Care',
  'resp-vocab':'Respiratory Vocabulary'
};

/* ===== state ===== */
let state=Store.get('slstate',null)||{xp:0,level:1,streak:0,lastDay:null,answered:0,correct:0,lastExamScore:null,bestExamScore:null,examHistory:[],mastery:{},review:[],badges:[],cardBox:{},seenQ:{},skillLvl:{},skillBadges:{}};
if(state.lastExamScore===undefined)state.lastExamScore=null;
if(state.bestExamScore===undefined)state.bestExamScore=null;
if(!state.examHistory)state.examHistory=[];
if(!state.seenQ)state.seenQ={};
if(!state.skillLvl)state.skillLvl={};
if(!state.skillBadges)state.skillBadges={};
if(!state.mastery)state.mastery={};
if(!state.review)state.review=[];
if(!state.badges)state.badges=[];
if(!state.cardBox)state.cardBox={};
if(state.totalXp===undefined){
  var retroXp=0;
  for(var lv=1;lv<state.level;lv++){retroXp+=(lv<=3?100:lv<=6?150:lv<=9?200:lv<=12?300:lv<=15?400:500);}
  state.totalXp=retroXp+state.xp;
}
Object.keys(SKILLS).forEach(s=>{
  if(!state.mastery[s])state.mastery[s]={seen:0,correct:0};
  if(!state.skillLvl[s])state.skillLvl[s]={xp:0,lv:1};
  if(!state.skillBadges[s])state.skillBadges[s]=[];
});
function save(){Store.set('slstate',state);}
var persist=function(){Store.set('slstate',state);};

/* ===== per-skill level helpers ===== */
function cefrLabel(lv){return lv<=15?'🌱 Sprout':lv<=30?'🌿 Grower':lv<=50?'🌳 Explorer':lv<=65?'🔬 Scientist':lv<=80?'🧪 Master':'🏆 Genius';}
function skillXpNeeded(lv){return 50+Math.floor(lv/5)*10;}
function addSkillXP(sk,n){if(!state.skillLvl[sk])state.skillLvl[sk]={xp:0,lv:1};var sl=state.skillLvl[sk];sl.xp+=n;var need=skillXpNeeded(sl.lv);while(sl.xp>=need&&sl.lv<100){sl.xp-=need;sl.lv++;need=skillXpNeeded(sl.lv);}persist();}

/* ===== streak ===== */
(function(){const today=new Date().toDateString();if(state.lastDay!==today){const y=new Date(Date.now()-864e5).toDateString();state.streak=(state.lastDay===y)?state.streak+1:1;state.lastDay=today;persist();}})();

/* ===== nav ===== */
const VIEWS=[['dash','🏠 Home'],['learn','📖 Learn'],['practice','🎮 Practice'],['cards','🃏 Flashcards'],['reinforce','💪 Reinforce'],['write','✍️ Write'],['exam','🏆 Exam'],['board','🏅 Leaderboard']];
const PRIMARY_TABS=['dash','learn','practice','cards','write','exam','board'];
const DROPDOWN_TABS=[['reinforce','💪 Reinforce']];
const tabsEl=document.getElementById('tabs');
VIEWS.forEach(([id,label])=>{
  if(PRIMARY_TABS.includes(id)){
    const b=document.createElement('button');b.className='tab';b.textContent=label;b.dataset.v=id;b.setAttribute('role','tab');b.setAttribute('aria-selected','false');b.setAttribute('aria-controls','v-'+id);b.onclick=()=>go(id);tabsEl.appendChild(b);
  }
});
var ddWrap=document.createElement('div');ddWrap.className='tab-dropdown';
var ddBtn=document.createElement('button');ddBtn.className='tab-dd-btn';ddBtn.textContent='📚 More';ddBtn.setAttribute('aria-haspopup','true');ddBtn.setAttribute('aria-expanded','false');
var ddMenu=document.createElement('div');ddMenu.className='tab-dd-menu';ddMenu.setAttribute('role','menu');
DROPDOWN_TABS.forEach(([id,label])=>{
  var item=document.createElement('button');item.className='tab-dd-item';item.textContent=label;item.dataset.v=id;item.setAttribute('role','menuitem');
  item.onclick=function(){go(id);ddMenu.classList.remove('show');ddBtn.setAttribute('aria-expanded','false');};
  ddMenu.appendChild(item);
});
ddBtn.onclick=function(e){e.stopPropagation();var open=ddMenu.classList.toggle('show');ddBtn.setAttribute('aria-expanded',open?'true':'false');};
document.addEventListener('click',function(){ddMenu.classList.remove('show');ddBtn.setAttribute('aria-expanded','false');});
ddWrap.appendChild(ddBtn);ddWrap.appendChild(ddMenu);tabsEl.appendChild(ddWrap);

var _activeView='dash';
function go(id){
  document.querySelectorAll('.view').forEach(v=>{v.classList.add('hidden');v.setAttribute('aria-hidden','true');});
  var target=document.getElementById('v-'+id);target.classList.remove('hidden');target.setAttribute('aria-hidden','false');
  document.querySelectorAll('.tab').forEach(t=>{var isActive=t.dataset.v===id;t.classList.toggle('active',isActive);t.setAttribute('aria-selected',isActive?'true':'false');});
  document.querySelectorAll('.tab-dd-item').forEach(t=>{var isActive=t.dataset.v===id;t.classList.toggle('active',isActive);});
  window.scrollTo({top:0,behavior:'smooth'});
  _activeView=id;
  if(id==='dash')renderDash();
  if(id==='learn')renderLearn();
  if(id==='practice')renderPracticeSetup();
  if(id==='cards')renderDeck();
  if(id==='reinforce')renderReinforce();
  if(id==='write')renderWrite();
  if(id==='exam')renderExamIntro();
  if(id==='board')loadBoard('xp');
}

/* ===== HUD ===== */
function renderHUD(){document.getElementById('sLevel').textContent=state.level;document.getElementById('sXp').textContent=(state.totalXp||0).toLocaleString();document.getElementById('sStreak').textContent=state.streak||0;}
function xpNeeded(lv){return lv<=3?100:lv<=6?150:lv<=9?200:lv<=12?300:lv<=15?400:500;}
function addXP(n){state.xp+=n;state.totalXp+=n;var need=xpNeeded(state.level);while(state.xp>=need){state.xp-=need;state.level++;showLevelUp();need=xpNeeded(state.level);}persist();renderHUD();}
function showLevelUp(){
  var msg=['Keep growing, '+firstName()+'! 🌱','You are a Scientist in the making, '+firstName()+'! 🔬','Amazing work, '+firstName()+' — God\'s creation is incredible!','Keep exploring God\'s world, '+firstName()+'! 🌍'][state.level%4];
  var tierMsg='';
  if(state.level===4)tierMsg='Level 4 unlocked! Harder Science questions ahead!';
  if(state.level===6)tierMsg='Level 6 unlocked! You are reaching Scientist level!';
  if(state.level===8)tierMsg='Level 8 unlocked! Highest level — Science Genius!';
  document.getElementById('lvlupTxt').textContent='LEVEL '+state.level;
  document.getElementById('lvlupMsg').innerHTML=(tierMsg?'<b>'+tierMsg+'</b><br>':'')+msg;
  document.getElementById('lvlup').classList.remove('hidden');
  confetti();
}

/* ===== toast + tts + confetti ===== */
function toast(msg,type){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;document.getElementById('toastFace').src='';t.className='toast show '+(type||'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2200);}
function speak(text){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.92;speechSynthesis.speak(u);}catch(e){}}

/* ===== GLOBAL LOADER UTILITY ===== */
var _flTimer=null;
function flLoaderHTML(msgs){
  return '<div class="fl-loader"><div class="fl-ring"></div><div class="fl-dots"><span></span><span></span><span></span></div><div class="fl-msg" id="flLoaderMsg">'+(msgs[0]||'Please wait…')+'</div></div>';
}
function startLoaderRotation(msgs,ms){
  if(_flTimer)clearInterval(_flTimer);
  var i=0;
  _flTimer=setInterval(function(){
    var el=document.getElementById('flLoaderMsg');
    if(!el){clearInterval(_flTimer);_flTimer=null;return;}
    el.classList.add('fade');
    setTimeout(function(){
      var el2=document.getElementById('flLoaderMsg');
      if(!el2)return;
      i=(i+1)%msgs.length;
      el2.textContent=msgs[i];
      el2.classList.remove('fade');
    },200);
  },ms||1400);
}
function stopLoader(){if(_flTimer){clearInterval(_flTimer);_flTimer=null;}}

function playCelebrationSound(big){try{var ctx=new(window.AudioContext||window.webkitAudioContext)();var comp=ctx.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=5;comp.connect(ctx.destination);var master=ctx.createGain();master.gain.value=0.85;master.connect(comp);var t=ctx.currentTime;var notes=big?[261.63,329.63,392.00,523.25,659.25,783.99,1046.50]:[523.25,659.25,783.99];var step=big?0.075:0.09;notes.forEach(function(freq,i){var nt=t+i*step;var o=ctx.createOscillator();var g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,nt);g.gain.linearRampToValueAtTime(0.32,nt+0.012);g.gain.exponentialRampToValueAtTime(0.001,nt+0.55);o.connect(g);g.connect(master);o.start(nt);o.stop(nt+0.6);});if(big){var sp=t+notes.length*step+0.04;[1046.50,1318.51,1567.98,2093.00].forEach(function(freq,i){var st=sp+i*0.038;var o=ctx.createOscillator();var g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0.13,st);g.gain.exponentialRampToValueAtTime(0.001,st+0.38);o.connect(g);g.connect(master);o.start(st);o.stop(st+0.42);});}setTimeout(function(){try{ctx.close();}catch(e){}},2800);}catch(e){}}
function confetti(){playCelebrationSound(true);const cs=['#1F8A4C','#5BB85C','#E9A72C','#7EC8E3','#C8202E'];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%5];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=2200+Math.random()*1500;d.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:'translateY(105vh) rotate('+(360+Math.random()*360)+'deg)',opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.4,1)'});setTimeout(()=>d.remove(),dur);}}
function miniConfetti(){playCelebrationSound(false);const cs=['#1F8A4C','#5BB85C','#E9A72C','#7EC8E3'];for(let i=0;i<28;i++){const d=document.createElement('div');d.className='confetti';d.style.left=(20+Math.random()*60)+'vw';d.style.background=cs[i%4];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1400+Math.random()*800;d.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:'translateY(60vh) rotate('+(180+Math.random()*360)+'deg)',opacity:.7}],{duration:dur,easing:'cubic-bezier(.25,.7,.4,1)'});setTimeout(()=>d.remove(),dur);}}

/* ===== badges ===== */
const BADGES=[
  {id:'first',ic:'🎯',nm:'First Discovery',desc:'Answer your first question correctly',color:'#1FAA66'},
  {id:'streak3',ic:'🔥',nm:'On Fire',desc:'Maintain a 3-day streak',color:'#E64545'},
  {id:'practice50',ic:'⚡',nm:'Lab Assistant',desc:'Answer 50 questions total',color:'#E9A72C'},
  {id:'practice100',ic:'💫',nm:'Science Star',desc:'Answer 100 questions total',color:'#BE8418'},
  {id:'accuracy80',ic:'🎖️',nm:'Accuracy Ace',desc:'Maintain 80%+ accuracy (30+ Qs)',color:'#1E50A0'},
  {id:'photo',ic:'🌞',nm:'Photosynthesis Pro',desc:'80%+ mastery on all photosynthesis skills',color:'#E9A72C'},
  {id:'resp',ic:'🫁',nm:'Respiration Hero',desc:'80%+ mastery on all respiration skills',color:'#C8202E'},
  {id:'tier2',ic:'🧭',nm:'Level 2 Explorer',desc:'Reach Level 2',color:'#1FAA66'},
  {id:'tier4',ic:'⚔️',nm:'Level 4 Challenger',desc:'Reach Level 4',color:'#E9A72C'},
  {id:'tier6',ic:'👑',nm:'Level 6 Champion',desc:'Reach Level 6',color:'#7A4FB5'},
  {id:'exam',ic:'🏆',nm:'Exam Warrior',desc:'Complete the final exam',color:'#E9A72C'},
  {id:'perfect',ic:'💯',nm:'Perfection',desc:'Score 100% on the final exam',color:'#0F3D2E'},
  {id:'explorer',ic:'🌍',nm:'Explorer',desc:'Reach Level 2 in ALL 12 skills',color:'#1E50A0'}
];
const SKILL_BADGES=[
  {id:'sk_lv2',  ic:'🌱',nm:'First Step',    desc:'Reach Level 2'},
  {id:'sk_lv5',  ic:'⚡',nm:'Building Up',   desc:'Reach Level 5'},
  {id:'sk_lv10', ic:'⭐',nm:'Solid Grower',  desc:'Reach Level 10'},
  {id:'sk_lv16', ic:'🎯',nm:'Leaf Achiever', desc:'Reach Level 16'},
  {id:'sk_lv31', ic:'🔥',nm:'Root Breaker',  desc:'Reach Level 31'},
  {id:'sk_lv51', ic:'💎',nm:'Tree Builder',  desc:'Reach Level 51'},
  {id:'sk_lv66', ic:'👑',nm:'Forest Master', desc:'Reach Level 66'},
  {id:'sk_lv81', ic:'🏆',nm:'Ecosystem King',desc:'Reach Level 81'},
  {id:'sk_acc80',ic:'🎓',nm:'Sharp Shooter', desc:'80%+ accuracy (10+ answers)'},
];
function checkSkillBadges(sk){
  if(!state.skillBadges)state.skillBadges={};
  if(!state.skillBadges[sk])state.skillBadges[sk]=[];
  var earned=state.skillBadges[sk];
  var sl=state.skillLvl[sk]||{lv:1,xp:0};
  var m=state.mastery[sk]||{seen:0,correct:0};
  var pct=m.seen>=10?Math.round(m.correct/m.seen*100):0;
  var toCheck=[
    {id:'sk_lv2', cond:sl.lv>=2},{id:'sk_lv5', cond:sl.lv>=5},
    {id:'sk_lv10',cond:sl.lv>=10},{id:'sk_lv16',cond:sl.lv>=16},
    {id:'sk_lv31',cond:sl.lv>=31},{id:'sk_lv51',cond:sl.lv>=51},
    {id:'sk_lv66',cond:sl.lv>=66},{id:'sk_lv81',cond:sl.lv>=81},
    {id:'sk_acc80',cond:pct>=80&&m.seen>=10},
  ];
  var newOnes=[];

function norm(q){return (q||'').toLowerCase().replace(/\s+/g,' ').trim();}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}
function buildQueue(mode,focusSk){
  if(mode==='review'){const ids=state.review.slice();queue=ids.map(i=>ITEMS[i]).filter(Boolean);if(!queue.length)queue=[];return;}
  var skLevels=Object.keys(SKILLS).map(function(s){return(state.skillLvl[s]||{lv:1}).lv;});
  var avgSkLv=Math.round(skLevels.reduce(function(a,b){return a+b;},0)/skLevels.length);
  var maxTier=avgSkLv>=51?4:avgSkLv>=31?3:avgSkLv>=16?2:1;
  var pool=ITEMS.filter(function(it){
    if(focusSk&&it.sk!==focusSk)return false;
    return true;
  });
  var unseen=pool.filter(function(it){return!state.seenQ[norm(it.q)];});
  var source=unseen.length>=5?unseen:pool;
  var weakSkills=Object.keys(SKILLS).filter(function(s){var m=state.mastery[s];return m&&m.seen>=3&&masteryPct(s)<60;}).map(function(s){return s;});
  var weakItems=source.filter(function(it){return weakSkills.includes(it.sk);});
  var otherItems=source.filter(function(it){return !weakSkills.includes(it.sk);});
  function pick(arr,n){var out=[],used=new Set();var a=arr.slice();for(var i=0;i<n;i++){var av=a.filter(function(x){return !used.has(norm(x.q));});if(!av.length)break;var ch=av[Math.floor(Math.random()*av.length)];out.push(ch);used.add(norm(ch.q));}return out;}
  var fromWeak=pick(weakItems,6);
  var fromOther=pick(otherItems,10-fromWeak.length);
  var combined=fromWeak.concat(fromOther);
  if(combined.length<10){var extra=pick(pool.filter(function(it){return !combined.find(function(c){return norm(c.q)===norm(it.q);});}),10-combined.length);combined=combined.concat(extra);}
  queue=shuffle(combined);
}

}

    else{qHTML=qHTML.replace(/___/g,'<span class="blank"></span>');}

function submitAnswer(optIdx){
  const it=curItem;if(!it)return;
  const correct = it.type==='fill' ? checkFill() : optIdx===it.a;
  hintUsed=false;
  const isCorrect = correct;
  const fbEl=document.getElementById('eqFb');
  if(it.type!=='fill'){
    document.querySelectorAll('.eq-opt').forEach((b,i)=>{b.disabled=true;b.classList.add(i===it.a?'correct':(i===optIdx?'wrong':''));});
  }
  let fbHtml = isCorrect
    ? '<div class="eq-fb ok">✅ <b>Correct!</b> '+(it.fb||'')+'</div>'
    : '<div class="eq-fb no">❌ <b>Not quite.</b> '+(it.fb||'')+'<br><span class="hint-tip" onclick="showHint()">💡 Need a hint?</span></div>';
  fbEl.innerHTML=fbHtml;
  if(isCorrect){miniConfetti();}
  // record
  recordAnswer(it.sk,isCorrect);
  if(!isCorrect){
    const qi=ITEMS.indexOf(it);
    if(qi>=0&&!state.review.includes(qi))state.review.push(qi);
    trackWrong(it.sk);
  }
  const hadXP = isCorrect ? 10 : 2;
  addXP(hadXP);
  syncToSupabase();
  // next
  document.getElementById('eqFb').scrollIntoView({behavior:'smooth',block:'nearest'});
  setTimeout(()=>{qIdx++;renderItem();},1600);
}
function checkFill(){
  const it=curItem;
  const val=document.getElementById('fillInput')?document.getElementById('fillInput').value.trim():'';
  const ans=(it.a||'').toString().toLowerCase().replace(/\s+/g,' ');
  const clean=(v)=>v.toLowerCase().replace(/\s+/g,' ').replace(/[.,!?;:'"()]/g,'');
  return clean(val)===clean(ans)||clean(val)===clean(it.a);
}

    '</div>';
}
function flipCard(){document.getElementById('fc').classList.toggle('flipped');document.getElementById('fcRating').style.display='flex';}
function rateCard(good){
  if(!curCard)return;
  const id=curCard.id;
  const cur=state.cardBox[id]||1;
  if(good)state.cardBox[id]=Math.min(5,cur+1);
  else if(cur===1)state.cardBox[id]=1;
  else state.cardBox[id]=cur-1;
  persist();
  addXP(8);
  syncToSupabase();
  toast(good?'🌟 Card learned!':'Keep practicing, you got this!','good');
  renderDeck();
}
// Space bar flips flashcard
document.addEventListener('keydown',function(e){
  var fc=document.querySelector('.flashcard');
  if(!fc)return;
  var activeView=document.getElementById('v-cards');
  if(!activeView||activeView.classList.contains('hidden'))return;
  if(e.key===' '||e.key==='Spacebar'){
    if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;
    e.preventDefault();flipCard();
  }
});

function startExam(){
  examQueue=shuffle(EXAM.slice());
  examIdx=0;examScore=0;
  renderExamQ();
}
function renderExamQ(){
  const e=document.getElementById('v-exam');
  if(examIdx>=examQueue.length){finishExam();return;}
  const it=examQueue[examIdx];
  e.innerHTML='<div class="exam-prog"><div class="eq-top"><span>🏆 Final Exam</span><span>'+(examIdx+1)+' / '+examQueue.length+'</span></div><div class="eq-prog"><div class="fill" style="width:'+(examIdx/examQueue.length*100)+'%"></div></div></div>'+
    '<div class="exam-q eq-card"><div class="eq-q">'+it.q+'</div><div class="eq-opts">'+it.o.map((o,j)=>'<button class="eq-opt" onclick="examAnswer('+j+')">'+o+'</button>').join('')+'</div></div>';
}
function examAnswer(j){
  const it=examQueue[examIdx];
  document.querySelectorAll('.exam-q .eq-opt').forEach((b,i)=>{b.disabled=true;b.classList.add(i===it.a?'correct':(i===j?'wrong':''));});
  if(j===it.a)examScore++;
  const e=document.getElementById('v-exam');
  const fb=document.createElement('div');fb.className='eq-fb '+(j===it.a?'ok':'no');fb.style.marginTop='14px';fb.innerHTML=(j===it.a?'✅ Correct! ':'❌ ')+it.fb;
  document.querySelector('.exam-q').appendChild(fb);
  setTimeout(()=>{examIdx++;renderExamQ();},1500);
}
function finishExam(){
  const pct=Math.round(examScore/examQueue.length*100);
  state.lastExamScore=pct;
  if(state.bestExamScore==null||pct>state.bestExamScore)state.bestExamScore=pct;
  state.examHistory.push({score:pct,date:new Date().toISOString(),count:examQueue.length});
  persist();
  addXP(pct>=50?50:10);
  award('exam');
  if(pct===100)award('perfect');
  syncNow();
  const e=document.getElementById('v-exam');
  const ringColor=pct>=80?'var(--ok)':pct>=50?'var(--gold)':'var(--bad)';
  const msg=pct>=80?'Outstanding, '+firstName()+'! 🌟':pct>=50?'Good job, '+firstName()+'! Keep growing! 🌱':'Don\'t give up, '+firstName()+'! Review and try again! 💪';
  e.innerHTML='<div class="exam-summary"><div style="font-size:4rem;animation:bob 3s ease-in-out infinite">'+(pct>=80?'🏆':pct>=50?'🌱':'💪')+'</div>'+
    '<h2 class="h-title" style="margin-top:10px">'+msg+'</h2>'+
    '<div class="score-ring" style="border-color:'+ringColor+';color:'+ringColor+'">'+pct+'%</div>'+
    '<p style="opacity:.8">'+examScore+' / '+examQueue.length+' correct · +'+(pct>=50?50:10)+' XP</p>'+
    '<div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">'+
      '<button class="btn btn-green" onclick="go(\'practice\')">Practice more 🎮</button>'+
      '<button class="btn btn-ghost" onclick="renderExamIntro()">Exam menu</button>'+
    '</div></div>';
  confetti();
}

async function loadBoard(sortKey){
  const e=document.getElementById('v-board');
  e.innerHTML='<span class="eyebrow">🏅 Leaderboard</span><h2 class="h-title">Science Ranking</h2><div class="fl-loader"><div class="fl-ring"></div><div class="fl-msg">Loading the class…</div></div>';
  try{
    const res=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?section=neq.teacher&select=*&order='+(sortKey==='xp'?'total_xp':sortKey)+'.desc',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const rows=await res.json();
    let sorted=rows.filter(r=>r.total_xp||r.xp).sort((a,b)=>(b.total_xp||b.xp||0)-(a.total_xp||a.xp||0));
    if(!sorted.length){
      e.innerHTML='<span class="eyebrow">🏅 Leaderboard</span><h2 class="h-title">Science Ranking</h2><p>No data yet — be the first to practice and appear here!</p>';
      return;
    }
    let html='<span class="eyebrow">🏅 Leaderboard</span><h2 class="h-title">Science Ranking</h2><p class="h-sub">Ranked by total XP. Practice to climb the leaderboard!</p>';
    sorted.forEach((r,i)=>{
      const isMe=playerName&&r.student_name===playerName;
      const rankCls=i===0?'r1':i===1?'r2':i===2?'r3':'';
      html+='<div class="lb-card '+(i<3?'top':'')+(isMe?' lb-me':'')+'"><div class="lb-rank '+rankCls+'">'+(i+1)+'</div><div class="lb-name">'+r.student_name+(isMe?' <span class="badge" style="background:var(--green);color:#fff;padding:2px 8px;border-radius:10px;font-size:.6rem">YOU</span>':'')+'<small>Level '+r.level+' · '+r.answered+' answers · '+(r.accuracy??0)+'% acc</small></div><div class="lb-xp">⚡ '+(r.total_xp||r.xp||0).toLocaleString()+'</div></div>';
    });
    e.innerHTML=html;
  }catch(err){
    e.innerHTML='<span class="eyebrow">🏅 Leaderboard</span><h2 class="h-title">Science Ranking</h2><p style="color:var(--bad)">Could not load leaderboard. Check Supabase config.<br><small>'+err.message+'</small></p>';
  }
}

    answered:state.answered,
    correct:state.correct,
    exam_score:state.lastExamScore!=null?state.lastExamScore:null,
    best_exam_score:state.bestExamScore!=null?state.bestExamScore:null,
    badges:state.badges,
    mastery:state.mastery,
    skill_lvl:state.skillLvl,
    card_box:state.cardBox||{},
    updated_at:new Date().toISOString()
  };
}
function doSync(){
  var body=buildSyncBody();
  fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?on_conflict=student_name',{
    method:'POST',
    headers:sbHeaders(),
    body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok){console.warn('Sync failed:',r.status);showSyncStatus('error');}
    else showSyncStatus('ok');
  }).catch(function(e){console.warn('Sync error:',e);showSyncStatus('error');});
}
function syncToSupabase(){
  if(!playerName||SB_URL.indexOf('YOUR-PROJECT')>=0)return;
  clearTimeout(syncTimer);
  showSyncStatus('syncing');
  syncTimer=setTimeout(doSync,1500);
}
function syncNow(){
  if(!playerName||SB_URL.indexOf('YOUR-PROJECT')>=0)return;
  clearTimeout(syncTimer);
  showSyncStatus('syncing');
  doSync();
}
function showSyncStatus(s){
  var el=document.getElementById('syncStatus');
  var lb=document.getElementById('syncLabel');
  if(!el||!lb)return;
  el.className='sync-indicator '+s;
  lb.textContent=s==='ok'?'Synced':s==='error'?'Offline':s==='syncing'?'Saving…':'Ready';
}

/* ===== NOTICE POLLER ===== */
async function pollNotices(){
  if(SB_URL.indexOf('YOUR-PROJECT')>=0)return;
  try{
    const res=await fetch(SB_URL+'/rest/v1/sciencelab_notices?active=eq.true&select=id,message,created_at&order=created_at.desc&limit=1',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!res.ok)return;
    const data=await res.json();
    const bar=document.getElementById('noticeBar');
    if(data.length){
      const n=data[0];
      bar.innerHTML='📢 <b>Teacher:</b> '+n.message+' <button onclick="ackNotice(\''+n.id+'\')" style="background:rgba(255,255,255,.25);color:#fff;border:none;padding:4px 14px;border-radius:20px;font-family:inherit;font-weight:600;cursor:pointer">✓ Got it</button>';
      bar.classList.remove('hidden');
    } else {
      bar.classList.add('hidden');
    }
  }catch(e){}
}
async function ackNotice(id){
  if(!playerName)return;
  try{
    await fetch(SB_URL+'/rest/v1/sciencelab_notice_reads',{
      method:'POST',
      headers:sbHeaders(),
      body:JSON.stringify({notice_id:id,student_name:playerName,section:playerSection||null,read_at:new Date().toISOString()})
    });
  }catch(e){}
  document.getElementById('noticeBar').classList.add('hidden');
}
setInterval(pollNotices,20000);

/* ===== ACCESSIBILITY ===== */
function trapFocus(el){
  var focusable=el.querySelectorAll('button,input,textarea,select,a[href],[tabindex]:not([tabindex="-1"])');
  if(!focusable.length)return;
  var first=focusable[0],last=focusable[focusable.length-1];
  el._trapHandler=function(e){
    if(e.key==='Tab'){
      if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
      else{if(document.activeElement===last){e.preventDefault();first.focus();}}
    }
    if(e.key==='Escape'){
      var close=el.querySelector('[onclick*="close"],button.wb-close');
      if(close)close.click();
    }
  };
  el.addEventListener('keydown',el._trapHandler);
  first.focus();
}
var _origShowInterv=showIntervention;
showIntervention=function(skill){_origShowInterv(skill);setTimeout(function(){var o=document.getElementById('intervOverlay');if(o)trapFocus(o);},250);};
var nm=document.getElementById('nameModal');
if(nm&&!nm.classList.contains('hidden'))setTimeout(function(){trapFocus(nm);},100);

  renderDash();
  renderLearn();
  renderPracticeSetup();
  renderDeck();
  renderReinforce();
  renderWrite();
  renderExamIntro();
  go('dash');
  // Auto-suggest weakest skill banner

        banner.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;background:linear-gradient(135deg,#0F3D2E,#1F8A4C);color:#fff;padding:16px 24px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px;max-width:540px;width:90%;animation:fade .5s';
        banner.innerHTML='<div style="font-size:2rem;flex-shrink:0">🎯</div><div style="flex:1"><div style="font-family:Bricolage Grotesque;font-weight:700;font-size:.95rem">Your weakest topic: '+SKILLS[weak[0]]+' ('+weak[1]+'%)</div><div style="font-size:.8rem;opacity:.8;margin-top:2px">Read the theory and practice to build confidence!</div></div><button onclick="document.getElementById(\'rfBanner\').remove();go(\'reinforce\')" style="background:var(--gold);color:var(--ink);border:none;padding:8px 16px;border-radius:10px;font-weight:700;font-size:.82rem;cursor:pointer;white-space:nowrap">Reinforce →</button><button onclick="document.getElementById(\'rfBanner\').remove()" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;opacity:.6;padding:4px 8px">✕</button>';
        document.body.appendChild(banner);
        setTimeout(function(){var b=document.getElementById('rfBanner');if(b)b.remove();},15000);
      },1500);

}

init();
if(!playerName){showNameModal();}else{syncToSupabase();setTimeout(pollNotices,1000);}
